# Two-material mixed elasticity: two-level MGR with a rigid-body-aware
# displacement solve and the application-supplied pressure-mass Schur operator.
mgr:
  max_iter: 1
  tolerance: 0.0
  print_level: 0
  coarse_th: 0.0
  level:
    0:
      f_dofs: [0, 1, 2, 3, 4, 5]
      f_relaxation:
        amg:
          max_iter: 2
          tolerance: 0.0
          interpolation:
            prolongation_type: extended+i
          coarsening:
            type: hmis
            strong_th: 0.25
            num_functions: 3
            nodal: 1
            nodal_type: 2
            interp_vec_variant: 2
            smooth_interp_vecs: 0
          relaxation:
            down_type: forward-hl1gs
            up_type: backward-hl1gs
            coarse_type: ge
      g_relaxation: none
      restriction_type: injection
      prolongation_type: jacobi
      coarse_level_type: user

  coarsest_level:
    gmres:
      max_iter: 1
      print_level: 0
      preconditioner:
        amg:
          max_iter: 1
          tolerance: 0.0
          interpolation:
            prolongation_type: extended+i
          coarsening:
            type: hmis
            strong_th: 0.3
            num_functions: 1
          relaxation:
            down_type: forward-hl1gs
            up_type: backward-hl1gs
            coarse_type: ge
