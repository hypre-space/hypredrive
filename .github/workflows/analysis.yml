name: Code Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'COPYRIGHT'
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'COPYRIGHT'
  schedule:
    - cron: '0 3 * * 0' # Runs at 03:00 UTC every Sunday
  workflow_dispatch:    # Allow manual triggering

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cppcheck:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.action == 'labeled' && github.event.label.name == 'Run CI') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'Run CI'))
      }}
    name: cppcheck
    runs-on: ubuntu-latest
    env:
      HYPRE_VERSION: master
      BUILD_DIR: build-analysis
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ubuntu environment
        timeout-minutes: 3
        uses: ./.github/actions/setup-ubuntu
        with:
          compiler: 'gcc'
          extra_packages: 'cppcheck'

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: 'gcc'
          build_type: 'Debug'
          hypre_shared_libs: 'ON'
          os: 'ubuntu-latest'

      - name: Configure hypredrive
        run: |
          set -euxo pipefail
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHYPREDRV_ENABLE_ANALYSIS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_PREFIX_PATH=${{ steps.build-hypre.outputs.hypre_prefix }}

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Run cppcheck
        run: cmake --build $BUILD_DIR --target cppcheck

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cppcheck-report
          path: ${{ env.BUILD_DIR }}/cppcheck-report.xml
          retention-days: 7

  clang-tidy:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.action == 'labeled' && github.event.label.name == 'Run CI') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'Run CI'))
      }}
    name: clang-tidy
    runs-on: ubuntu-latest
    env:
      HYPRE_VERSION: master
      BUILD_DIR: build-analysis
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ubuntu environment
        timeout-minutes: 3
        uses: ./.github/actions/setup-ubuntu
        with:
          compiler: 'clang'
          extra_packages: 'clang-tidy'

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: 'clang'
          build_type: 'Debug'
          hypre_shared_libs: 'ON'
          os: 'ubuntu-latest'

      - name: Configure hypredrive
        run: |
          set -euxo pipefail
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_C_FLAGS="-Wconversion -Wextra -Wshadow" \
            -DHYPREDRV_ENABLE_ANALYSIS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_PREFIX_PATH=${{ steps.build-hypre.outputs.hypre_prefix }}

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Run clang-tidy
        run: cmake --build $BUILD_DIR --target clang-tidy

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clang-tidy-report
          path: ${{ env.BUILD_DIR }}/clang-tidy-output.txt
          retention-days: 7

  sanitizers:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.action == 'labeled' && github.event.label.name == 'Run CI') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'Run CI'))
      }}
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang] # gcc, clang
    env:
      HYPRE_VERSION: master
      BUILD_DIR: build-sanitizers-${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ubuntu environment
        timeout-minutes: 3
        uses: ./.github/actions/setup-ubuntu
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: ${{ matrix.compiler }}
          build_type: 'Debug'
          hypre_shared_libs: 'ON'
          os: 'ubuntu-latest'

      - name: Configure hypredrive with sanitizers
        run: |
          set -euxo pipefail
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHYPREDRV_ENABLE_TESTING=ON -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DHYPREDRV_ENABLE_ANALYSIS=ON \
            -DHYPREDRV_ASAN_OPTIONS=detect_leaks=1:abort_on_error=1:print_stacktrace=1:fast_unwind_on_malloc=0 \
            -DHYPREDRV_LSAN_OPTIONS=suppressions=${{ github.workspace }}/.github/lsan.supp \
            -DHYPREDRV_UBSAN_OPTIONS=print_stacktrace=1:abort_on_error=1 \
            -DCMAKE_PREFIX_PATH=${{ steps.build-hypre.outputs.hypre_prefix }} \
            -DCMAKE_C_COMPILER=mpicc

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Fetch datasets
        run: cmake --build $BUILD_DIR --target data --parallel

      - name: Run tests with sanitizers
        timeout-minutes: 8
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
        run: ctest --test-dir $BUILD_DIR --output-on-failure --timeout 40 # 40 seconds per test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sanitizer-logs-${{ matrix.compiler }}
          path: |
            ${{ env.BUILD_DIR }}/Testing
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log

  complexity:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.action == 'labeled' && github.event.label.name == 'Run CI') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'Run CI'))
      }}
    name: cyclomatic complexity
    runs-on: ubuntu-latest
    env:
      # Pinned so a lizard release cannot silently change the metric or the gate.
      LIZARD_VERSION: 1.24.0
      REPORT_DIR: build-complexity
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lizard
        timeout-minutes: 3
        run: python -m pip install "lizard==${LIZARD_VERSION}"

      # Source-only analysis: no HYPRE build or compile database needed.
      - name: Check cyclomatic complexity
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          bash scripts/check_complexity.sh --report "$REPORT_DIR" 2>&1 | \
            tee "$REPORT_DIR/complexity.txt"

      - name: Complexity summary
        if: always()
        run: |
          {
            echo "### Cyclomatic Complexity"
            echo
            echo '```'
            cat "$REPORT_DIR/complexity.txt" 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: complexity-report
          path: |
            ${{ env.REPORT_DIR }}/complexity.csv
            ${{ env.REPORT_DIR }}/complexity.xml
            ${{ env.REPORT_DIR }}/complexity.txt
          retention-days: 7
