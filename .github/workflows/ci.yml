name: CI
run-name: ${{ github.event.action == 'labeled' && github.event.label.name != 'Run CI' && 'Unrelated label' || 'CI validation' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master, ci/reliable-checks]
  schedule:
    - cron: '20 3 * * 0'
  workflow_dispatch:

concurrency:
  # Unrelated label events must neither replace real validation nor emit its check name.
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event.action == 'labeled' && github.event.label.name != 'Run CI' && github.run_id || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
  OMPI_MCA_memory: "^patcher"

jobs:
  select:
    name: Select CI checks
    if: github.event.action != 'labeled' || github.event.label.name == 'Run CI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.select.outputs.core }}
      expanded: ${{ steps.select.outputs.expanded }}
      docs: ${{ steps.select.outputs.docs }}
      bindings: ${{ steps.select.outputs.bindings }}
      julia: ${{ steps.select.outputs.julia }}
      abi: ${{ steps.select.outputs.abi }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EXPANDED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'Run CI') }}
        run: python3 scripts/select_ci.py

  source-checks:
    name: Source checks
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify CMake and Autotools source lists
        run: python3 scripts/check_source_sync.py
      - name: Check private symbol prefixes
        run: bash scripts/check_private_prefix.sh
      - name: Check public APIs and bindings
        run: |
          bash scripts/list_public_apis.sh --check
          bash scripts/check_interface_coverage.sh
      - name: Install formatters
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          python -m pip install fprettify==0.3.7

      - name: clang-format check
        run: |
          set -euxo pipefail
          find include src examples/src -type f \( -name "*.c" -o -name "*.h" \) | \
            xargs clang-format-18 -n --Werror

      - name: fprettify check
        run: |
          set -euxo pipefail
          diff=$(find interfaces/fortran -type f -name "*.f90" -exec fprettify -i 3 --diff {} +)
          if [[ -n "$diff" ]]; then
            printf '%s\n' "$diff"
            exit 1
          fi

  windows-mingw-build:
    needs: select
    if: needs.select.outputs.expanded == 'true'
    name: Windows | MinGW-w64 | MS-MPI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Cache datasets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Install Microsoft MPI
        shell: pwsh
        run: ./scripts/install_msmpi.ps1

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-windows-mingw-${{ github.sha }}
          restore-keys: |
            ccache-windows-mingw-

      - name: Configure and build hypredrive
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ runner.temp }}\ccache
          CCACHE_MAXSIZE: 300M
        run: |
          set -euxo pipefail
          mpi_inc="$(cygpath -m "${MSMPI_INC}")"
          mpi_bin="$(cygpath -m "${MSMPI_BIN}")"
          mpi_lib_dir="$(cygpath -u "${MSMPI_LIB64}")"
          if [[ -f "${mpi_lib_dir}/msmpi64.lib" ]]; then
            mpi_lib="${mpi_lib_dir}/msmpi64.lib"
          else
            mpi_lib="${mpi_lib_dir}/msmpi.lib"
          fi
          test -f "${mpi_lib}"
          mpi_lib="$(cygpath -m "${mpi_lib}")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=ON \
            -DHYPRE_VERSION=v3.2.1 \
            -DHYPREDRV_ENABLE_TESTING=ON \
            -DHYPREDRV_ENABLE_EXAMPLES=OFF \
            -DHYPRE_ENABLE_MPI=ON \
            -DHYPRE_ENABLE_FORTRAN=OFF \
            -DHYPRE_ENABLE_CUDA=OFF \
            -DHYPRE_ENABLE_HIP=OFF \
            -DHYPRE_ENABLE_SYCL=OFF \
            -DMPIEXEC_EXECUTABLE="${mpi_bin}/mpiexec.exe" \
            -DMPIEXEC_NUMPROC_FLAG=-n \
            -DMPI_C_HEADER_DIR="${mpi_inc}" \
            -DMPI_C_INCLUDE_DIRS="${mpi_inc}" \
            -DMPI_C_INCLUDE_PATH="${mpi_inc}" \
            -DMPI_C_LIB_NAMES=msmpi \
            -DMPI_msmpi_LIBRARY="${mpi_lib}" \
            -DMPI_C_LIBRARIES="${mpi_lib}" \
            -DMPI_C_WORKS=TRUE \
            -DMPI_CXX_HEADER_DIR="${mpi_inc}" \
            -DMPI_CXX_INCLUDE_DIRS="${mpi_inc}" \
            -DMPI_CXX_LIB_NAMES=msmpi \
            -DMPI_CXX_msmpi_LIBRARY="${mpi_lib}" \
            -DMPI_CXX_LIBRARIES="${mpi_lib}" \
            -DMPI_CXX_WORKS=TRUE \
            -DMPI_C_VERSION=3.0 \
            -DMPI_CXX_VERSION=3.0
          cmake --build build --parallel
          ccache --show-stats

      - name: Run CTest suite
        timeout-minutes: 15
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          while IFS= read -r dir; do
            export PATH="$dir:$PATH"
          done < <(find "$PWD/build" -type f -name '*.dll' -printf '%h\n' | sort -u)
          export TMPDIR="$(cygpath -m "$RUNNER_TEMP")"
          if ctest --test-dir build --output-on-failure --no-tests=error --timeout 60; then
            exit 0
          else
            ctest_status=$?
            failed_log="$PWD/build/Testing/Temporary/LastTestsFailed.log"
            if [[ -f "$failed_log" ]]; then
              while IFS=: read -r _ test_name; do
                echo "::error title=CTest failure::$test_name"
              done < "$failed_log"
            fi
            exit "$ctest_status"
          fi

      - name: Save ccache
        if: github.ref == 'refs/heads/master' && steps.restore-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-windows-mingw-${{ github.sha }}

  windows-native-build:
    needs: select
    if: needs.select.outputs.core == 'true'
    name: Windows | ${{ matrix.compiler }} | MS-MPI
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.expanded == 'true' && '[{"compiler":"MSVC","toolset":"v143"},{"compiler":"clang-cl","toolset":"ClangCL"}]' || '[{"compiler":"MSVC","toolset":"v143"}]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache datasets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Install Microsoft MPI
        shell: pwsh
        run: ./scripts/install_msmpi.ps1

      - name: Configure hypredrive
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP 'hypredrive-${{ matrix.compiler }}-build'
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_DIR=$buildDir"
          cmake -S . -B "$buildDir" -G "Visual Studio 17 2022" -A x64 `
            -T "${{ matrix.toolset }}" `
            "-DCMAKE_C_FLAGS=/std:c11 /utf-8 /DWIN32" `
            "-DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP/hypredrive-${{ matrix.compiler }}-install" `
            -DBUILD_SHARED_LIBS=ON `
            "-DHYPRE_VERSION=v3.2.1" `
            -DHYPREDRV_ENABLE_TESTING=ON `
            -DHYPREDRV_ENABLE_EXAMPLES=OFF `
            -DHYPRE_ENABLE_MPI=ON `
            -DHYPRE_ENABLE_FORTRAN=OFF `
            -DHYPRE_ENABLE_CUDA=OFF `
            -DHYPRE_ENABLE_HIP=OFF `
            -DHYPRE_ENABLE_SYCL=OFF `
            -DMPI_GUESS_LIBRARY_NAME=MSMPI `
            "-DMPIEXEC_EXECUTABLE=$env:MSMPI_BIN/mpiexec.exe" `
            -DMPIEXEC_NUMPROC_FLAG=-n

      - name: Build hypredrive
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release --parallel

      - name: Run CTest suite
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dllDirs = Get-ChildItem -Path $env:BUILD_DIR -Filter '*.dll' -Recurse |
            Select-Object -ExpandProperty DirectoryName -Unique
          $env:PATH = ($dllDirs -join ';') + ";$env:PATH"
          $env:TMPDIR = $env:RUNNER_TEMP
          ctest --test-dir "$env:BUILD_DIR" -C Release --output-on-failure --no-tests=error --timeout 60
          $ctestStatus = $LASTEXITCODE
          if ($ctestStatus -ne 0) {
            $failedLog = Join-Path $env:BUILD_DIR 'Testing/Temporary/LastTestsFailed.log'
            if (Test-Path $failedLog) {
              foreach ($line in Get-Content $failedLog) {
                $testName = $line -replace '^\d+:', ''
                Write-Output "::error title=CTest failure::$testName"
              }
            }
            exit $ctestStatus
          }

  python-interface:
    needs: select
    if: needs.select.outputs.bindings == 'true'
    name: ${{ matrix.os }} | Python 3.12 | installed HYPRE
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            mpi_flavor: openmpi
          - os: macos-latest
            compiler: clang
            mpi_flavor: mpich
    env:
      HYPRE_VERSION: v3.2.1
      BUILD_DIR: build-python
      INSTALL_PREFIX: ${{ github.workspace }}/install-python
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interfaces/python/pyproject.toml

      - name: Install system dependencies (Ubuntu)
        timeout-minutes: 5
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopenmpi-dev openmpi-bin gcc g++
          echo "OMPI_CC=gcc" >> $GITHUB_ENV
          echo "OMPI_CXX=g++" >> $GITHUB_ENV

      - name: Install system dependencies (macOS)
        timeout-minutes: 3
        if: startsWith(runner.os, 'macOS')
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew untap --force aws/tap >/dev/null 2>&1 || true
          brew install cmake ninja mpich
          echo "MPICH_CC=clang" >> $GITHUB_ENV
          echo "MPICH_CXX=clang++" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy cython scikit-build-core mpi4py

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: ${{ matrix.compiler }}
          build_type: Debug
          hypre_shared_libs: 'ON'
          os: ${{ matrix.os }}
          mpi_flavor: ${{ matrix.mpi_flavor }}

      - name: Cache datasets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Configure hypredrive with Python interface
        run: |
          set -euxo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DHYPREDRV_ENABLE_PYTHON=ON \
            -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DHYPREDRV_ENABLE_TESTING=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_PREFIX_PATH="${{ steps.build-hypre.outputs.hypre_prefix }}" \
            -DCMAKE_C_COMPILER=mpicc

      - name: Build and run in-tree Python tests
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
        run: cmake --build "$BUILD_DIR" --target python-test --parallel

      - name: Install hypredrive C library
        run: cmake --build "$BUILD_DIR" --target install --parallel

      - name: Build and install Python package from installed hypredrive
        run: |
          set -euxo pipefail
          python -m pip install --force-reinstall "./interfaces/python[test]" \
            --config-settings=cmake.define.HYPREDRV_DIR="$INSTALL_PREFIX/lib/cmake/HYPREDRV" \
            --config-settings=cmake.define.CMAKE_PREFIX_PATH="${{ steps.build-hypre.outputs.hypre_prefix }}"

      - name: Run installed-package Python tests
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
        run: |
          set -euxo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            export LD_LIBRARY_PATH="$INSTALL_PREFIX/lib:${{ steps.build-hypre.outputs.hypre_prefix }}/lib:${LD_LIBRARY_PATH:-}"
          else
            export DYLD_LIBRARY_PATH="$INSTALL_PREFIX/lib:${{ steps.build-hypre.outputs.hypre_prefix }}/lib:${DYLD_LIBRARY_PATH:-}"
          fi
          python -m pytest -q --tb=short interfaces/python/tests/test_options.py interfaces/python/tests/test_solve_serial.py -ra
          mpiexec -n 2 python -m pytest -q --tb=short interfaces/python/tests/test_solve_mpi.py interfaces/python/tests/laplacian/test_example_mpi.py -ra

      - name: Upload Python CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: python-logs-${{ matrix.os }}
          path: |
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log

  python-interface-autofetch:
    needs: select
    if: needs.select.outputs.expanded == 'true'
    name: ubuntu-latest | Python 3.12 | auto-fetch HYPRE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_DIR: build-python-autofetch
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interfaces/python/pyproject.toml

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopenmpi-dev openmpi-bin gcc g++
          echo "OMPI_CC=gcc" >> $GITHUB_ENV
          echo "OMPI_CXX=g++" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy cython scikit-build-core mpi4py

      - name: Configure hypredrive with auto-fetched HYPRE and Python interface
        run: |
          set -euxo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHYPRE_VERSION=master \
            -DHYPREDRV_ENABLE_PYTHON=ON \
            -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DHYPREDRV_ENABLE_TESTING=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=mpicc

      - name: Build and run Python tests
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
        run: cmake --build "$BUILD_DIR" --target python-test --parallel

      - name: Upload Python auto-fetch logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: python-autofetch-logs
          path: |
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log

  rust-interface:
    needs: select
    if: needs.select.outputs.bindings == 'true'
    name: ubuntu-latest | Rust 1.82 | ${{ matrix.mpi }} | ${{ matrix.hypre_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: openmpi
            packages: libopenmpi-dev openmpi-bin
            hypre_mode: default
          - mpi: mpich
            packages: libmpich-dev mpich
            hypre_mode: mixedint
          - mpi: openmpi
            packages: libopenmpi-dev openmpi-bin
            hypre_mode: bigint
          - mpi: openmpi
            packages: libopenmpi-dev openmpi-bin
            hypre_mode: single
    env:
      OMP_NUM_THREADS: 1
      OMPI_MCA_rmaps_base_oversubscribe: 1
      RUSTUP_TOOLCHAIN: '1.82.0'
    steps:
      - uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev ${{ matrix.packages }}
          sudo update-alternatives --set mpi /usr/bin/mpicc.${{ matrix.mpi }}
          sudo update-alternatives --set mpirun /usr/bin/mpirun.${{ matrix.mpi }}

      - name: Set up Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # The single-precision job only runs the rejection check and finishes first;
      # it must not save a partial registry under the shared key.
      - name: Cache Cargo registry
        if: matrix.hypre_mode != 'single'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('interfaces/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: v3.2.0
          compiler: gcc
          build_type: Release
          mpi_flavor: ${{ matrix.mpi }}
          hypre_mixedint: ${{ matrix.hypre_mode == 'mixedint' && 'ON' || 'OFF' }}
          hypre_bigint: ${{ matrix.hypre_mode == 'bigint' && 'ON' || 'OFF' }}
          hypre_single: ${{ matrix.hypre_mode == 'single' && 'ON' || 'OFF' }}

      - name: Configure the Rust interface
        if: matrix.hypre_mode != 'single'
        run: |
          set -euxo pipefail
          rust_build="$(mktemp -d "$RUNNER_TEMP/hypredrive-rust-build-XXXXXXXX")"
          rust_install="$(mktemp -d "$RUNNER_TEMP/hypredrive-rust-install-XXXXXXXX")"
          echo "RUST_BUILD=$rust_build" >> "$GITHUB_ENV"
          echo "RUST_INSTALL=$rust_install" >> "$GITHUB_ENV"
          cmake -S . -B "$rust_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DHYPREDRV_ENABLE_RUST=ON \
            -DHYPREDRV_ENABLE_TESTING=ON \
            -DHYPREDRV_DATASETS= \
            -DCMAKE_INSTALL_PREFIX="$rust_install" \
            -DCMAKE_PREFIX_PATH="${{ steps.build-hypre.outputs.hypre_prefix }}" \
            -DCMAKE_C_COMPILER=mpicc

      - name: Build and run Rust tests
        if: matrix.hypre_mode != 'single'
        run: cmake --build "$RUST_BUILD" --target rust-test --parallel

      - name: Verify scalar configuration rejection
        if: matrix.hypre_mode == 'single'
        env:
          HYPRE_INSTALL: ${{ steps.build-hypre.outputs.hypre_prefix }}
        run: |
          set -euxo pipefail
          rust_build="$(mktemp -d "$RUNNER_TEMP/hypredrive-rust-single-XXXXXXXX")"
          if { cmake -S . -B "$rust_build" -G Ninja \
                 -DBUILD_SHARED_LIBS=ON \
                 -DHYPREDRV_ENABLE_RUST=ON \
                 -DCMAKE_PREFIX_PATH="$HYPRE_INSTALL" \
                 -DCMAKE_C_COMPILER=mpicc &&
               cmake --build "$rust_build" --target rust-build --parallel; } \
                 > "$rust_build/rejection.log" 2>&1; then
            echo "::error::Rust build unexpectedly accepted single-precision HYPRE"
            exit 1
          fi
          cat "$rust_build/rejection.log"
          grep -Fi 'requires real, double-precision HYPRE' "$rust_build/rejection.log"

      - name: Run an external Cargo consumer against the installation
        if: matrix.hypre_mode == 'default'
        env:
          HYPRE_INSTALL: ${{ steps.build-hypre.outputs.hypre_prefix }}
        run: |
          set -euxo pipefail
          cmake --build "$RUST_BUILD" --target install --parallel
          consumer="$(mktemp -d "$RUNNER_TEMP/hypredrive-rust-consumer-XXXXXXXX")"
          mkdir "$consumer/src"
          cp interfaces/rust/examples/minimal.rs "$consumer/src/main.rs"
          # Reuse the crate's committed resolution so a new transitive release
          # cannot break the consumer on a toolchain it does not support.
          cp interfaces/rust/Cargo.lock "$consumer/Cargo.lock"
          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "hypredrive-install-check"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          hypredrive = { path = "$PWD/interfaces/rust" }
          mpi = { version = "0.8", default-features = false }
          EOF
          cd "$consumer"
          export MPICC="$(command -v mpicc)"
          export CMAKE_PREFIX_PATH="$RUST_INSTALL:$HYPRE_INSTALL"
          export LD_LIBRARY_PATH="$RUST_INSTALL/lib:$HYPRE_INSTALL/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo run

  native-interfaces:
    name: Ubuntu | ${{ matrix.name }} interface
    needs: select
    if: needs.select.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: C++, option: CPP, target: cpp-test, packages: g++, compiler: '-DCMAKE_CXX_COMPILER=mpicxx'}
          - {name: Fortran, option: FORTRAN, target: fortran-test, packages: gfortran, compiler: '-DCMAKE_Fortran_COMPILER=mpifort'}
          - {name: Octave, option: MATLAB, target: matlab-test, packages: 'octave octave-dev', compiler: ''}
    env:
      OMPI_FC: gfortran
      OMP_NUM_THREADS: 1
      BUILD_DIR: build-interface
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ubuntu
        with:
          extra_packages: ${{ matrix.packages }}
      - uses: ./.github/actions/build-hypre
        id: hypre
        with:
          hypre_version: v3.2.1
      - name: Configure and test
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON \
            -DHYPREDRV_ENABLE_TESTING=ON -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DHYPREDRV_ENABLE_${{ matrix.option }}=ON ${{ matrix.compiler }} \
            -DCMAKE_PREFIX_PATH="${{ steps.hypre.outputs.hypre_prefix }}" \
            -DCMAKE_C_COMPILER=mpicc
          cmake --build "$BUILD_DIR" --target ${{ matrix.target }} --parallel
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-logs
          path: |
            ${{ env.BUILD_DIR }}/Testing
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml

  build-and-test:
    needs: select
    if: needs.select.outputs.core == 'true'
    name: ${{ matrix.os }} | ${{ matrix.compiler }} | ${{ matrix.build_type }} | ${{ matrix.hypre_version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      OMPI_MCA_rmaps_base_oversubscribe: 1
      OMP_NUM_THREADS: 1
      HYPRE_VERSION: ${{ matrix.hypre_version }}
      BUILD_DIR: build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ubuntu
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-ubuntu
        with:
          compiler: ${{ matrix.compiler }}
          extra_packages: ccache liblapack-dev

      - name: Setup ccache (Ubuntu)
        if: startsWith(runner.os, 'Linux')
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          # PR runs restore master's cache but do not add per-run entries to the
          # repository cache quota.
          save: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
          # ccache-action appends '-' to each restore key itself.
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}

      - name: Install dependencies (macOS)
        timeout-minutes: 3
        if: startsWith(runner.os, 'macOS')
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew untap --force aws/tap >/dev/null 2>&1 || true
          brew install mpich

      - name: Setup compiler environment (macOS)
        if: startsWith(runner.os, 'macOS')
        run: |
          # macOS mpicc uses clang by default (Apple Clang)
          export MPICH_CC=clang
          export MPICH_CXX=clang++
          echo "MPICH_CC=clang" >> $GITHUB_ENV
          echo "MPICH_CXX=clang++" >> $GITHUB_ENV

      - name: Cache datasets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          hypre_shared_libs: ${{ matrix.shared }}
          os: ${{ matrix.os }}
          mpi_flavor: ${{ startsWith(matrix.os, 'macos') && 'mpich' || 'openmpi' }}

      - name: Configure hypredrive
        run: |
          set -euxo pipefail
          CCACHE_ARGS=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            CCACHE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache"
          fi
          HYPRE_PREFIX="${{ steps.build-hypre.outputs.hypre_prefix }}"
          HYPRE_ARGS="-DCMAKE_PREFIX_PATH=${HYPRE_PREFIX} -DHYPRE_VERSION=${{ matrix.hypre_version }}"
          if [[ "${{ matrix.hypre_version }}" =~ ^v ]] && \
             printf "%s\n" "v2.32.0" "${{ matrix.hypre_version }}" | sort -V | head -n1 | grep -q "^${{ matrix.hypre_version }}$"; then
            HYPRE_INCLUDE_DIRS="${HYPRE_PREFIX}/include"
            if [ -f "${HYPRE_PREFIX}/lib/libHYPRE.so" ]; then
              HYPRE_LIBRARIES="${HYPRE_PREFIX}/lib/libHYPRE.so"
            elif [ -f "${HYPRE_PREFIX}/lib/libHYPRE.dylib" ]; then
              HYPRE_LIBRARIES="${HYPRE_PREFIX}/lib/libHYPRE.dylib"
            else
              HYPRE_LIBRARIES="${HYPRE_PREFIX}/lib/libHYPRE.a"
            fi
            HYPRE_ARGS="${HYPRE_ARGS} -DHYPRE_INCLUDE_DIRS=${HYPRE_INCLUDE_DIRS} -DHYPRE_LIBRARIES=${HYPRE_LIBRARIES}"
          fi
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHYPREDRV_ENABLE_TESTING=ON -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx \
            -DHYPREDRV_ENABLE_EIGSPEC=${{ matrix.cpu_features }} \
            -DHYPREDRV_ENABLE_EXAMPLE_OMP=${{ matrix.cpu_features }} \
            ${HYPRE_ARGS} \
            $CCACHE_ARGS

      - name: Verify configured compilers
        env:
          EXPECTED_COMPILER: ${{ matrix.compiler == 'gcc' && 'GNU' || (runner.os == 'macOS' && 'AppleClang' || 'Clang') }}
        run: |
          set -euo pipefail
          for lang in C CXX; do
            compiler_id=$(sed -n "s/^set(CMAKE_${lang}_COMPILER_ID \"\([^\"]*\)\").*/\1/p" "$BUILD_DIR"/CMakeFiles/*/CMake"${lang}"Compiler.cmake)
            printf '%s compiler ID is %s (expected %s)\n' "$lang" "$compiler_id" "$EXPECTED_COMPILER" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$compiler_id" = "$EXPECTED_COMPILER"
          done

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Fetch datasets
        run: |
          set -euxo pipefail
          # The data target validates every configured dataset and fetches any
          # missing or incomplete archive.  Do not use one legacy dataset as a
          # proxy for the complete cache.
          cmake --build "$BUILD_DIR" --target data --parallel

      - name: Run tests
        timeout-minutes: ${{ matrix.os == 'macos-latest' && 10 || 5 }}
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
        run: |
          if ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error --timeout 60; then
            exit 0
          else
            ctest_status=$?
            failed_log="$BUILD_DIR/Testing/Temporary/LastTestsFailed.log"
            if [[ -f "$failed_log" ]]; then
              while IFS=: read -r _ test_name; do
                echo "::error title=CTest failure::$test_name"
              done < "$failed_log"
            fi
            exit "$ctest_status"
          fi

      - name: Check CLI numerical results
        if: matrix.cpu_features == 'ON'
        run: python3 scripts/check_cli_regression.py "$BUILD_DIR/hypredrive-cli" "$BUILD_DIR/cli-regression"

      - name: Exercise two-thread OpenMP assembly
        if: matrix.cpu_features == 'ON'
        env:
          OMP_NUM_THREADS: 2
        run: |
          grep -F 'FLAGS = ' "$BUILD_DIR/build.ninja" | grep -F -- '-fopenmp'
          ctest --test-dir "$BUILD_DIR" --no-tests=error --output-on-failure -R '^laplacian_.*1proc$'
          ctest --test-dir "$BUILD_DIR" --no-tests=error --output-on-failure -R '^eigspec_mpi_[24]proc$'

      - name: Check library symbol prefixes
        if: matrix.compiler == 'clang' && runner.os == 'Linux' && matrix.hypre_version == 'v3.2.1'
        run: bash scripts/check_symbol_prefix.sh --build-dir "$BUILD_DIR"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.hypre_version }}
          path: |
            ${{ env.BUILD_DIR }}/cli-regression
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/Testing
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log

  autotools-build-and-test:
    needs: select
    if: needs.select.outputs.expanded == 'true'
    name: ubuntu-latest | autotools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HYPRE_VERSION: master
      HYPRE_COMPILER: gcc
      HYPRE_BUILD_TYPE: Debug
      HYPRE_LIBTYPE: shared
      HYPRE_MIXEDINT: OFF
      HYPRE_OS: ubuntu-latest
      HYPRE_MPI_FLAVOR: openmpi
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu)
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool m4 make \
            libopenmpi-dev openmpi-bin gcc g++

      # This job fetches only a subset of the datasets.  Restore the complete
      # set saved by the full-set jobs, but never save: actions/cache entries are
      # immutable, so a subset-only entry would shadow the complete one.
      - name: Restore datasets (subset job; never saves)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Build HYPRE
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: ${{ env.HYPRE_COMPILER }}
          build_type: ${{ env.HYPRE_BUILD_TYPE }}
          hypre_shared_libs: 'ON'
          hypre_mixedint: ${{ env.HYPRE_MIXEDINT }}
          os: ubuntu-latest
          mpi_flavor: ${{ env.HYPRE_MPI_FLAVOR }}

      - name: Fetch datasets
        run: |
          set -euxo pipefail
          cmake -S . -B build-data \
            -DHYPREDRV_ENABLE_DATA=ON \
            -DHYPREDRV_DATASETS=ps3d10pt7 \
            -DCMAKE_PREFIX_PATH=${{ steps.build-hypre.outputs.hypre_prefix }}
          cmake --build build-data --target data --parallel

      - name: Build and test (autotools)
        run: |
          set -euxo pipefail
          HYPRE_DIR="${{ steps.build-hypre.outputs.hypre_prefix }}"
          autoreconf -iv
          ./configure --with-hypre-dir="${HYPRE_DIR}" \
                      --prefix="$(pwd)/install-autotools"
          make -j"$(getconf _NPROCESSORS_ONLN)"
          OMPI_ALLOW_RUN_AS_ROOT=1 \
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
          OMPI_MCA_btl_vader_single_copy_mechanism=none \
          OMPI_MCA_rmaps_base_oversubscribe=1 \
          OMP_NUM_THREADS=1 \
          make check
          make install

  build-and-test-optional-deps:
    needs: select
    if: needs.select.outputs.expanded == 'true'
    name: ubuntu-latest | gcc | ${{ matrix.dependency.name }}+Debug
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependency:
          - name: Caliper
            cache_key: caliper
            build_dir: build-caliper
            hypre_version: master
            cmake_options: -DHYPREDRV_ENABLE_CALIPER=ON
            build_shared_libs: 'ON'
            apt_packages: ''
            required_datasets: 'ps3d10pt7;compflow6k;poromech2k'
            ctest_regex: ''
            runtime_env: CALI_CONFIG=runtime-report
          - name: SuperLU_DIST
            cache_key: superlu-dist
            build_dir: build-superlu-dist
            hypre_version: v3.2.0
            cmake_options: -DHYPREDRV_BUILD_DSUPERLU=ON
            build_shared_libs: 'OFF'
            apt_packages: libopenblas-dev
            required_datasets: compflow6k
            ctest_regex: hypredrive_test_ex3_mgr_(frelax|grelax|coarsest)_spdirect_1proc
            runtime_env: ''
    env:
      HYPRE_VERSION: ${{ matrix.dependency.hypre_version }}
      BUILD_DIR: ${{ matrix.dependency.build_dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libopenmpi-dev openmpi-bin ccache gcc g++ make \
            ${{ matrix.dependency.apt_packages }}

      - name: Setup compiler environment
        run: |
          export OMPI_CC=gcc
          export OMPI_CXX=g++
          echo "OMPI_CC=gcc" >> $GITHUB_ENV
          echo "OMPI_CXX=g++" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          # PR runs restore master's cache but do not add per-run entries to the
          # repository cache quota.
          save: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ runner.os }}-${{ matrix.dependency.cache_key }}-${{ github.sha }}
          # ccache-action appends '-' to each restore key itself.
          restore-keys: |
            ${{ runner.os }}-${{ matrix.dependency.cache_key }}

      # This job fetches only a subset of the datasets.  Restore the complete
      # set saved by the full-set jobs, but never save: actions/cache entries are
      # immutable, so a subset-only entry would shadow the complete one.
      - name: Restore datasets (subset job; never saves)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Configure hypredrive with ${{ matrix.dependency.name }}
        run: |
          set -euxo pipefail
          cmake -S . -B $BUILD_DIR \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHYPRE_VERSION=${HYPRE_VERSION} \
            -DHYPREDRV_ENABLE_TESTING=ON \
            -DHYPREDRV_ENABLE_EXAMPLES=ON \
            "-DHYPREDRV_DATASETS=${{ matrix.dependency.required_datasets }}" \
            "-DBUILD_SHARED_LIBS=${{ matrix.dependency.build_shared_libs }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            ${{ matrix.dependency.cmake_options }}

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Fetch datasets
        run: |
          set -euxo pipefail
          cmake --build "$BUILD_DIR" --target data --parallel

      - name: Run tests with ${{ matrix.dependency.name }}
        timeout-minutes: 5
        env:
          # OpenMPI configuration for CI
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
          OPTIONAL_DEP_RUNTIME_ENV: ${{ matrix.dependency.runtime_env }}
        run: |
          set -euxo pipefail
          if [ -n "${OPTIONAL_DEP_RUNTIME_ENV}" ]; then
            export "${OPTIONAL_DEP_RUNTIME_ENV}"
          fi
          cd $BUILD_DIR
          CTEST_ARGS=(--output-on-failure --no-tests=error --timeout 60)
          if [ -n "${{ matrix.dependency.ctest_regex }}" ]; then
            CTEST_ARGS+=(-R "${{ matrix.dependency.ctest_regex }}")
          fi
          ctest "${CTEST_ARGS[@]}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.dependency.cache_key }}
          path: |
            ${{ env.BUILD_DIR }}/Testing
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log

  build-and-test-mixedint:
    needs: select
    if: needs.select.outputs.expanded == 'true'
    name: ubuntu-latest | gcc | mixedint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HYPRE_VERSION: master
      BUILD_DIR: build-mixedint
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu)
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopenmpi-dev openmpi-bin ccache gcc g++ clang-format

      - name: Setup compiler environment
        run: |
          export OMPI_CC=gcc
          export OMPI_CXX=g++
          echo "OMPI_CC=gcc" >> $GITHUB_ENV
          echo "OMPI_CXX=g++" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          # PR runs restore master's cache but do not add per-run entries to the
          # repository cache quota.
          save: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ runner.os }}-mixedint-${{ github.sha }}
          # ccache-action appends '-' to each restore key itself.
          restore-keys: |
            ${{ runner.os }}-mixedint

      - name: Cache datasets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data
          key: datasets-v3-full-${{ hashFiles('cmake/HYPREDRV_Data.cmake') }}

      - name: Build HYPRE (mixedint)
        id: build-hypre
        uses: ./.github/actions/build-hypre
        with:
          hypre_version: ${{ env.HYPRE_VERSION }}
          compiler: gcc
          build_type: 'Debug'
          hypre_shared_libs: 'ON'
          hypre_mixedint: 'ON'
          os: ubuntu-latest

      - name: Configure hypredrive (mixedint)
        run: |
          set -euxo pipefail
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHYPREDRV_ENABLE_TESTING=ON -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_PREFIX_PATH=${{ steps.build-hypre.outputs.hypre_prefix }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Fetch datasets
        run: |
          set -euxo pipefail
          cmake --build "$BUILD_DIR" --target data --parallel

      - name: Run tests
        timeout-minutes: 5
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          OMP_NUM_THREADS: 1
        run: ctest --test-dir $BUILD_DIR --output-on-failure --timeout 30

  analysis:
    needs: select
    if: (github.event_name == 'pull_request' || github.ref_name == 'ci/reliable-checks') && needs.select.outputs.core == 'true'
    uses: ./.github/workflows/analysis.yml

  coverage:
    needs: select
    if: (github.event_name == 'pull_request' || github.ref_name == 'ci/reliable-checks') && needs.select.outputs.core == 'true'
    uses: ./.github/workflows/coverage.yml

  fuzz:
    needs: select
    if: (github.event_name == 'pull_request' || github.ref_name == 'ci/reliable-checks') && needs.select.outputs.core == 'true'
    uses: ./.github/workflows/fuzz.yml

  portability:
    needs: select
    if: (github.event_name == 'pull_request' || github.ref_name == 'ci/reliable-checks') && needs.select.outputs.core == 'true'
    uses: ./.github/workflows/portability.yml

  docs:
    needs: select
    if: (github.event_name == 'pull_request' || github.ref_name == 'ci/reliable-checks') && needs.select.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml

  julia-interface:
    name: Julia interface
    needs: select
    if: needs.select.outputs.julia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.10'
      - uses: ./.github/actions/setup-ubuntu
        with:
          compiler: gcc
          extra_packages: libmpich-dev mpich
      - name: Select MPICH to match Julia's MPI default
        run: |
          sudo update-alternatives --set mpi /usr/bin/mpicc.mpich
          sudo update-alternatives --set mpirun /usr/bin/mpirun.mpich
      - uses: ./.github/actions/build-hypre
        id: hypre
        with:
          hypre_version: v3.2.1
          mpi_flavor: mpich
      - name: Configure and run Julia tests
        run: |
          cmake -S . -B "$RUNNER_TEMP/julia-build" -G Ninja \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_PREFIX_PATH="${{ steps.hypre.outputs.hypre_prefix }}" \
            -DBUILD_SHARED_LIBS=ON -DHYPREDRV_ENABLE_TESTING=ON \
            -DHYPREDRV_ENABLE_JULIA=ON -DHYPREDRV_ENABLE_EXAMPLES=ON \
            -DHYPREDRV_DATASETS=
          cmake --build "$RUNNER_TEMP/julia-build" --parallel
          cmake --build "$RUNNER_TEMP/julia-build" --parallel --target julia-test

  abi:
    name: Public ABI
    needs: select
    if: needs.select.outputs.abi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ubuntu
        with:
          extra_packages: abigail-tools
      - uses: ./.github/actions/build-hypre
        id: hypre
        with:
          hypre_version: v3.2.1
      - name: Compare to the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          HYPRE_PREFIX: ${{ steps.hypre.outputs.hypre_prefix }}
        run: bash scripts/check_public_abi.sh

  required:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'Run CI' && 'Unrelated label' || 'Required CI' }}
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'Run CI')
    needs:
      - select
      - source-checks
      - build-and-test
      - windows-native-build
      - windows-mingw-build
      - build-and-test-mixedint
      - build-and-test-optional-deps
      - autotools-build-and-test
      - python-interface-autofetch
      - python-interface
      - rust-interface
      - native-interfaces
      - julia-interface
      - analysis
      - coverage
      - fuzz
      - portability
      - docs
      - abi
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify results of selected jobs
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOBS"])
          selection = jobs["select"]["outputs"]
          expected = {"select", "source-checks"}
          groups = {
              "core": {"build-and-test", "windows-native-build"},
              "expanded": {"windows-mingw-build", "build-and-test-mixedint",
                           "build-and-test-optional-deps", "autotools-build-and-test",
                           "python-interface-autofetch"},
              "bindings": {"python-interface", "rust-interface", "native-interfaces"},
              "julia": {"julia-interface"},
              "abi": {"abi"},
          }
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request" or os.environ["GITHUB_REF_NAME"] == "ci/reliable-checks":
              groups["core"].update({"analysis", "coverage", "fuzz", "portability"})
              groups["docs"] = {"docs"}
          for flag, names in groups.items():
              if selection.get(flag) == "true":
                  expected.update(names)
          failed = [
              (name, jobs.get(name, {}).get("result", "missing"))
              for name in sorted(expected)
              if jobs.get(name, {}).get("result") != "success"
          ]
          for name, result in failed:
              print(f"::error::{name} was expected to succeed but reported {result}")
          raise SystemExit(bool(failed))
          PY

  # Bridge the existing required contexts during rollout. Remove this job
  # after the default-branch ruleset requires only Required CI.
  legacy-required:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'Run CI' && format('Unrelated label ({0})', matrix.context) || matrix.context }}
    if: always() && github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'Run CI')
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        context:
          - ASan and UBSan (clang)
          - ubuntu-latest | gcc | Caliper+Debug
          - ubuntu-latest | autotools
          - ubuntu-latest | clang | Debug | master
          - ubuntu-latest | gcc | Debug | master
          - gcov
          - code format
    steps:
      - env:
          REQUIRED_CI_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_CI_RESULT" = success
