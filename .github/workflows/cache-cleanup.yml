name: Cache Cleanup

# Keeps the repository's Actions cache quota (10 GB) from filling with entries
# that can never be restored again: caches scoped to closed pull requests and
# keys that no workflow produces anymore.

on:
  # Runs from the base branch and never checks out pull request code; the only
  # input used is the integer pull request number.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '0 5 * * 1' # Runs at 05:00 UTC every Monday
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  closed-pull-request:
    if: github.event_name == 'pull_request_target'
    name: Delete caches of the closed pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete caches
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh cache list --ref "refs/pull/${PR_NUMBER}/merge" --limit 1000 --json id --jq '.[].id' |
            while read -r id; do
              gh cache delete "$id"
            done

  sweep:
    if: github.event_name != 'pull_request_target'
    name: Delete caches that can no longer be restored
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete caches of pull requests that are not open
        run: |
          set -euo pipefail
          refs=$(gh cache list --limit 1000 --json ref --jq '.[].ref' | sort -u | grep -E '^refs/pull/[0-9]+/merge$' || true)
          for ref in $refs; do
            number=${ref#refs/pull/}
            number=${number%/merge}
            state=$(gh pr view "$number" --json state --jq .state)
            if [ "$state" = "OPEN" ]; then
              continue
            fi
            echo "Deleting caches of $state pull request #$number"
            gh cache list --ref "$ref" --limit 1000 --json id --jq '.[].id' |
              while read -r id; do
                gh cache delete "$id"
              done
          done

      - name: Delete caches under retired keys
        # No workflow produces these keys anymore: the fuzz corpus cache was
        # never read back, the keyless ccache entries came from a duplicate
        # step, and datasets-v2 held a partial dataset set.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for key in fuzz-corpus ccache-20 datasets-v2; do
            echo "Deleting caches with key prefix $key"
            gh cache list --key "$key" --limit 1000 --json id --jq '.[].id' |
              while read -r id; do
                gh cache delete "$id"
              done
          done
