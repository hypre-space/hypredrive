name: Cache Cleanup

# Keeps the repository's Actions cache quota (10 GB) from filling with entries
# that can never be restored again: caches scoped to closed pull requests and
# keys that no workflow produces anymore.

on:
  # Runs from the base branch and never checks out pull request code; the only
  # input used is the integer pull request number.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '0 5 * * 1' # Runs at 05:00 UTC every Monday
  workflow_dispatch:

permissions: {}

concurrency:
  # Serialize PR-close cleanups separately from sweep so a burst of closed PRs
  # cannot contend for repository runner slots or evict a queued sweep; any PR
  # cleanup dropped when the 1-deep queue is full is caught by the weekly sweep.
  group: cache-cleanup-${{ github.event_name == 'pull_request_target' && 'pr' || 'sweep' }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  closed-pull-request:
    if: github.event_name == 'pull_request_target'
    name: Delete caches of the closed pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete caches
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          delete_cache() {
            local id=$1 err
            if [[ -z "$id" ]]; then
              return 0
            fi
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "::warning::Skipping unexpected cache id: $id"
              return 0
            fi
            if err=$(gh cache delete "$id" 2>&1); then
              [[ -n "$err" ]] && printf '%s\n' "$err"
              return 0
            fi
            if printf '%s\n' "$err" | grep -Eiq 'HTTP 404|not found'; then
              echo "Cache $id already absent; skipping"
              return 0
            fi
            echo "::error::Failed to delete cache $id: $err" >&2
            return 1
          }

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number: $PR_NUMBER"
            exit 1
          fi
          ids=$(gh cache list --ref "refs/pull/${PR_NUMBER}/merge" --limit 1000 --json id --jq '.[].id')
          while IFS= read -r id; do
            delete_cache "$id"
          done <<< "$ids"

  sweep:
    if: github.event_name != 'pull_request_target'
    name: Delete caches that can no longer be restored
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Delete caches of pull requests that are not open
        run: |
          set -euo pipefail
          delete_cache() {
            local id=$1 err
            if [[ -z "$id" ]]; then
              return 0
            fi
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "::warning::Skipping unexpected cache id: $id"
              return 0
            fi
            if err=$(gh cache delete "$id" 2>&1); then
              [[ -n "$err" ]] && printf '%s\n' "$err"
              return 0
            fi
            if printf '%s\n' "$err" | grep -Eiq 'HTTP 404|not found'; then
              echo "Cache $id already absent; skipping"
              return 0
            fi
            echo "::error::Failed to delete cache $id: $err" >&2
            return 1
          }

          all_refs=$(gh cache list --limit 1000 --json ref --jq '.[].ref')
          refs=$(printf '%s\n' "$all_refs" | sort -u | grep -E '^refs/pull/[0-9]+/merge$' || true)
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            number=${ref#refs/pull/}
            number=${number%/merge}
            if ! state=$(gh pr view "$number" --json state --jq .state); then
              echo "::warning::Failed to query state of pull request #$number; skipping"
              continue
            fi
            if [[ "$state" == "OPEN" ]]; then
              continue
            fi
            echo "Deleting caches of $state pull request #$number"
            ids=$(gh cache list --ref "$ref" --limit 1000 --json id --jq '.[].id')
            while IFS= read -r id; do
              delete_cache "$id"
            done <<< "$ids"
          done <<< "$refs"

      - name: Delete caches under retired keys
        # No workflow produces these keys anymore: the fuzz corpus cache was
        # never read back, the keyless ccache entries came from a duplicate
        # step, and datasets-v2 held a partial dataset set.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          delete_cache() {
            local id=$1 err
            if [[ -z "$id" ]]; then
              return 0
            fi
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "::warning::Skipping unexpected cache id: $id"
              return 0
            fi
            if err=$(gh cache delete "$id" 2>&1); then
              [[ -n "$err" ]] && printf '%s\n' "$err"
              return 0
            fi
            if printf '%s\n' "$err" | grep -Eiq 'HTTP 404|not found'; then
              echo "Cache $id already absent; skipping"
              return 0
            fi
            echo "::error::Failed to delete cache $id: $err" >&2
            return 1
          }

          for key in fuzz-corpus ccache-20 datasets-v2; do
            echo "Deleting caches with key prefix $key"
            ids=$(gh cache list --key "$key" --limit 1000 --json id --jq '.[].id')
            while IFS= read -r id; do
              delete_cache "$id"
            done <<< "$ids"
          done
