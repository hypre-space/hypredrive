[package]
name = "hypredrive"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "A safe Rust interface to the hypredrive linear solver"
license = "MIT"
repository = "https://github.com/hypre-space/hypredrive"
build = "build.rs"
links = "HYPREDRV"

[dependencies]
mpi = { version = "0.8", default-features = false }

[build-dependencies]
bindgen = "0.71"

[[test]]
name = "smoke"
harness = false
